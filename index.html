<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mobile Price Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            margin-top: 100px;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 20px;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #ff7a18;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff9a44;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📱 Mobile Price Predictor</h1>

        <input type="number" id="ram" placeholder="Enter RAM (GB)">
        <input type="number" id="storage" placeholder="Enter Storage (GB)">
        
        <br>
        <button onclick="predict()">Predict Price</button>

        <div id="result"></div>
    </div>

    <script>
        function predict() {
            let ram = document.getElementById("ram").value;
            let storage = document.getElementById("storage").value;

            if (ram && storage) {
                let price = (ram * 5000) + (storage * 200);
                document.getElementById("result").innerText =
                    "Estimated Price: ₹ " + price;
            } else {
                document.getElementById("result").innerText =
                    "⚠️ Please enter all values";
            }
        }
    </script>

</body>
</html>
